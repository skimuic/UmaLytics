name: Publish public release
on:
  push:
    branches: [main]
    paths: ['package.json', 'scripts/publish-release.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:all
      - name: Package and publish public assets
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
