name: Publish public release
on:
  push:
    branches: [main]
    paths: ['package.json', 'scripts/publish-release.mjs']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select immutable release source
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v${version}-open-beta.1"
          cp scripts/publish-release.mjs "$RUNNER_TEMP/umalytics-publish-release.mjs"
          cp tests/release.test.mjs "$RUNNER_TEMP/umalytics-release.test.mjs"
          if git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null 2>&1; then
            git checkout --detach "$tag"
          fi
          echo "RELEASE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/umalytics-publish-release.mjs" scripts/publish-release.mjs
          cp "$RUNNER_TEMP/umalytics-release.test.mjs" tests/release.test.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:all
      - name: Package and publish public assets
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
